[package]
name = "mcrypt"
description = "A simple file encryption and decryption utility"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/mira444nlh/mcrypt"
homepage = "https://github.com/mira444nlh/mcrypt"

[dependencies]
rand = "0.10.2"
argon2 = "0.6"
chacha20poly1305 = "0.11"
clap = { version = "4.6.7", features = ["derive"] }
rpassword = "7.5.4"
colored = "3.1.1"
thiserror = "2.0.20"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
